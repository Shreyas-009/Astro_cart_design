<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pikachu Page</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div id="left">
        <img src="./title.png" alt="title" id="title">
        <img src="./pokeball.png" alt="pokeball" id="pokeball">

        <div id="info">
            <h4>POKEMON GEN I</h4>
            <h1>Pikachu</h1>
            <p>Pikachu is an Electric-type Pokémon introduced in Generation I. Pikachu are small, chubby, and incredibly cute
            mouse-like Pokémon.
            They are almost completely covered by yellow fur</p>
            <div id="date">
                <hr>
                <p>01/08</p>                
            </div>
        </div>
    </div>
    <div id="right">
        <img src="./menu.svg" alt="menu" id="menu">
        <div id="dots">
            <div id="black_dot"></div>
            <div class="yellow_dots"></div>
            <div class="yellow_dots"></div>
            <div class="yellow_dots"></div>
            <div class="yellow_dots"></div>
        </div>
    </div>
    <img src="./pokemon.png" alt="pokemon_image" id="pokemon">
</body>
</html>
